name: Build HK Local8 Stag Fix

on:
  push:
    branches:
      - chatgpt-hk-alpha40-build
    paths:
      - 'hk-stagfix/**'
      - '.github/workflows/chatgpt-hk-alpha40.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Modding API v77 refs
        run: |
          curl -L --fail --retry 3 -o api.zip https://github.com/hk-modding/api/releases/download/1.5.78.11833-77/moddingapi.v77.windows.zip
          unzip -q api.zip -d api
          find api -name Assembly-CSharp.dll -print
      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          MANAGED="$(dirname "$(find api -name Assembly-CSharp.dll -print -quit)")"
          echo "Assembly-CSharp dir: $MANAGED"
          find api -type f -name '*.dll' -printf '%p\n' | sort
          CSC="$(find /usr/share/dotnet/sdk -path '*/Roslyn/bincore/csc.dll' | sort -V | tail -1)"
          OUT="$PWD/out"
          mkdir -p "$OUT"
          RSP="$OUT/compile.rsp"
          {
            echo "-nologo"
            echo "-nostdlib+"
            echo "-target:library"
            echo "-langversion:latest"
            echo "-optimize+"
            echo "-deterministic+"
            echo "-debug:portable"
            echo "-out:$OUT/HollowKnightLocal8StagFix.dll"
            find api -type f -name '*.dll' ! -iname 'UnitySceneRepacker.dll' -print0 | sort -z | while IFS= read -r -d '' dll; do
              printf '%s\n' "-r:$dll"
            done
            echo "$PWD/hk-stagfix/Local8StagFix.cs"
          } > "$RSP"
          dotnet "$CSC" "@$RSP"
          file "$OUT/HollowKnightLocal8StagFix.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: HollowKnightLocal8-alpha40-stagfix
          path: out/HollowKnightLocal8StagFix.dll
