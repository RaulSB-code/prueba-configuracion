name: Build HollowKnight Local8 alpha86 v2

on:
  push:
    branches:
      - chatgpt-hk-alpha86-main
    paths:
      - 'a86v2/**'
      - '.github/workflows/build-hk-alpha86-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct alpha84 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          $b64=(Get-Content a84/source.b64 -Raw) -replace '\s',''
          [IO.File]::WriteAllBytes('source.tar.xz',[Convert]::FromBase64String($b64))
          tar -xJf source.tar.xz -C work
          if($LASTEXITCODE -ne 0){ throw 'Base source extraction failed' }
          New-Item -ItemType Directory -Force work/assets | Out-Null
          $asset=(Get-Content a84/RoomWaitFrame.b64 -Raw) -replace '\s',''
          [IO.File]::WriteAllBytes('work/assets/RoomWaitFrame.png',[Convert]::FromBase64String($asset))

      - name: Apply reconstructed alpha86 patch
        shell: pwsh
        run: |
          $b64=(Get-Content a86v2/alpha86.patch.gz.b64 -Raw) -replace '\s',''
          [IO.File]::WriteAllBytes('alpha86.patch.gz',[Convert]::FromBase64String($b64))
          gzip -d -c alpha86.patch.gz | Set-Content alpha86.patch
          git apply --check --directory=work alpha86.patch
          if($LASTEXITCODE -ne 0){ throw 'alpha86 patch check failed' }
          git apply --directory=work alpha86.patch
          if($LASTEXITCODE -ne 0){ throw 'alpha86 patch apply failed' }
          foreach($p in @('src/FlowerRules.cs','src/ChallengeSequence.cs')) {
            if(-not (Test-Path ("work/"+$p))){ throw "Missing $p" }
          }
          $plugin=Get-Content work/src/Plugin.cs -Raw
          if(-not $plugin.Contains('0.3.47-alpha86')){ throw 'alpha86 version missing' }
          if(-not (Select-String -Quiet work/src/ChallengeSequence.cs -Pattern 'watchdog recovered')){ throw 'challenge watchdog missing' }
          Write-Host 'Source patch verified'

      - name: Download Modding API v77
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/hk-modding/api/releases/download/1.5.78.11833-77/moddingapi.v77.windows.zip' -OutFile api.zip
          Expand-Archive api.zip -DestinationPath api -Force
          $asm=Get-ChildItem api -Recurse -Filter Assembly-CSharp.dll | Select-Object -First 1
          $pm=Get-ChildItem api -Recurse -Filter PlayMaker.dll | Select-Object -First 1
          if(-not $asm -or -not $pm){ throw 'Required game refs missing' }

      - name: Generate MMHOOK references
        shell: pwsh
        run: |
          $v='22.7.31.1'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/monomod.runtimedetour.hookgen/$v/monomod.runtimedetour.hookgen.$v.nupkg" -OutFile hookgen.zip
          Expand-Archive hookgen.zip -DestinationPath hookgen -Force
          $exe=Get-ChildItem hookgen -Recurse -Filter MonoMod.RuntimeDetour.HookGen.exe | Select-Object -First 1
          if(-not $exe){ throw 'HookGen missing' }
          $apiDlls=Get-ChildItem api -Recurse -Filter *.dll
          Copy-Item $apiDlls.FullName $exe.Directory.FullName -Force
          $asm=Get-ChildItem api -Recurse -Filter Assembly-CSharp.dll | Select-Object -First 1
          $pm=Get-ChildItem api -Recurse -Filter PlayMaker.dll | Select-Object -First 1
          Push-Location $exe.Directory.FullName
          & $exe.FullName $asm.FullName
          if($LASTEXITCODE -ne 0){ throw "HookGen Assembly-CSharp failed $LASTEXITCODE" }
          & $exe.FullName $pm.FullName
          if($LASTEXITCODE -ne 0){ throw "HookGen PlayMaker failed $LASTEXITCODE" }
          Pop-Location
          New-Item -ItemType Directory -Force generated | Out-Null
          Copy-Item (Get-ChildItem $exe.Directory.FullName -Filter 'MMHOOK_*.dll').FullName generated -Force

      - name: Compile alpha86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $sdk=dotnet --version
          $csc="$env:ProgramFiles/dotnet/sdk/$sdk/Roslyn/bincore/csc.dll"
          $framework='C:/Program Files (x86)/Reference Assemblies/Microsoft/Framework/.NETFramework/v4.7.2'
          $refs=@()
          $refs += Get-ChildItem $framework -Filter *.dll | ForEach-Object { "-reference:$($_.FullName)" }
          $refs += Get-ChildItem api -Recurse -Filter *.dll | Where-Object { $_.Name -ne 'UnitySceneRepacker.dll' } | ForEach-Object { "-reference:$($_.FullName)" }
          $refs += Get-ChildItem generated -Filter *.dll | ForEach-Object { "-reference:$($_.FullName)" }
          $srcs=Get-ChildItem work/src -Filter *.cs | ForEach-Object { $_.FullName }
          & dotnet $csc -nologo -target:library -langversion:latest -optimize+ -deterministic+ -nostdlib+ "-out:$env:GITHUB_WORKSPACE/out/HollowKnightLocal8.dll" "-resource:$env:GITHUB_WORKSPACE/work/assets/RoomWaitFrame.png,Local8.RoomWaitFrame" @refs @srcs
          if($LASTEXITCODE -ne 0){ throw "Compilation failed $LASTEXITCODE" }
          Copy-Item out/HollowKnightLocal8.dll out/HollowKnightLocal8-alpha86.dll
          $bytes=[IO.File]::ReadAllBytes('out/HollowKnightLocal8-alpha86.dll')
          $ascii=[Text.Encoding]::ASCII.GetString($bytes)
          foreach($m in @('Hollow Knight Local 8','0.3.47-alpha86','Challenge Start','Pale Flower')) {
            if(-not $ascii.Contains($m)){ Write-Host "Marker not plain ASCII: $m" }
          }
          Write-Host "Built $((Get-Item out/HollowKnightLocal8-alpha86.dll).Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: HollowKnightLocal8-alpha86
          path: out/HollowKnightLocal8-alpha86.dll
          if-no-files-found: error
