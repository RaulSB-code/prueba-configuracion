name: Export alpha86 v2 patch
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-hk-alpha86-main]
    paths: ['.github/workflows/export-alpha86-patch.yml']
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch
        shell: bash
        run: |
          tr -d '\r\n\t ' < a86v2/alpha86.patch.gz.b64 | base64 -d > alpha86.patch.gz
          gzip -dc alpha86.patch.gz > alpha86.patch
          wc -c alpha86.patch
          sed -n '1,80p' alpha86.patch
      - uses: actions/upload-artifact@v4
        with:
          name: alpha86-v2-plain-patch
          path: alpha86.patch
