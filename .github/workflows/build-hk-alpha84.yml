name: Build HollowKnight Local8 alpha84

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - chatgpt-hk-alpha84-main
    paths:
      - 'a84/**'
      - '.github/workflows/build-hk-alpha84.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          tr -d '\r\n' < a84/source.b64 | base64 -d > source.tar.xz
          tar -xJf source.tar.xz -C work
          mkdir -p work/assets
          tr -d '\r\n' < a84/RoomWaitFrame.b64 | base64 -d > work/assets/RoomWaitFrame.png
          test -s work/src/Plugin.cs
          test -s work/assets/RoomWaitFrame.png
          grep -q '0.3.49-alpha84' work/src/Plugin.cs
          grep -q 'class DreamSequence' work/src/DreamSequence.cs
          grep -q 'class CameraFadeRecovery' work/src/CameraFadeRecovery.cs
      - name: Restore HollowKnight GameLibs refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p refproj
          cat > refproj/refproj.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>netstandard2.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="HollowKnight.GameLibs" Version="1.0.0-hollowknight.1.5.78.11833.api77" />
            </ItemGroup>
          </Project>
          EOF
          cat > refproj/nuget.config <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="hk-gamelibs" value="https://nuget.pkg.github.com/jakobhellermann/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <hk-gamelibs>
                <add key="Username" value="${GITHUB_ACTOR}" />
                <add key="ClearTextPassword" value="${GH_TOKEN}" />
              </hk-gamelibs>
            </packageSourceCredentials>
          </configuration>
          EOF
          dotnet restore refproj/refproj.csproj --configfile refproj/nuget.config
          GAMELIBS="$HOME/.nuget/packages/hollowknight.gamelibs/1.0.0-hollowknight.1.5.78.11833.api77"
          test -d "$GAMELIBS"
          find "$GAMELIBS" -type f -name '*.dll' -print | sort
          test -n "$(find "$GAMELIBS" -type f -name Assembly-CSharp.dll -print -quit)"
          test -n "$(find "$GAMELIBS" -type f -name UnityEngine.CoreModule.dll -print -quit)"
          test -n "$(find "$GAMELIBS" -type f -name PlayMaker.dll -print -quit)"
      - name: Compile Local8
        shell: bash
        run: |
          set -euo pipefail
          CSC="$(find /usr/share/dotnet/sdk -path '*/Roslyn/bincore/csc.dll' | sort -V | tail -1)"
          OUT="$PWD/out"
          mkdir -p "$OUT"
          RSP="$OUT/compile.rsp"
          {
            echo "-nologo"
            echo "-nostdlib+"
            echo "-target:library"
            echo "-langversion:latest"
            echo "-optimize+"
            echo "-deterministic+"
            echo "-debug:portable"
            echo "-out:$OUT/HollowKnightLocal8.dll"
            echo "-resource:$PWD/work/assets/RoomWaitFrame.png,Local8.RoomWaitFrame"
            GAMELIBS="$HOME/.nuget/packages/hollowknight.gamelibs/1.0.0-hollowknight.1.5.78.11833.api77"
            find "$GAMELIBS" -type f -name '*.dll' ! -iname 'UnitySceneRepacker.dll' -print0 | sort -z | while IFS= read -r -d '' dll; do
              printf '%s\n' "-r:$dll"
            done
            find "$PWD/work/src" -maxdepth 1 -type f -name '*.cs' -print | sort
          } > "$RSP"
          dotnet "$CSC" "@$RSP"
          cp "$OUT/HollowKnightLocal8.dll" "$OUT/HollowKnightLocal8-alpha84.dll"
          file "$OUT/HollowKnightLocal8-alpha84.dll"
          strings "$OUT/HollowKnightLocal8-alpha84.dll" | grep -q 'Hollow Knight Local 8'
      - uses: actions/upload-artifact@v4
        with:
          name: HollowKnightLocal8-alpha84
          path: out/HollowKnightLocal8-alpha84.dll
