name: Build HollowKnight Local8 alpha84

on:
  push:
    branches:
      - chatgpt-hk-alpha84-main
    paths:
      - 'a84/**'
      - '.github/workflows/build-hk-alpha84.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct alpha84 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/assets
          tr -d '\r\n' < a84/source.b64 | base64 -d > source.tar.xz
          tar -xJf source.tar.xz -C work
          tr -d '\r\n' < a84/RoomWaitFrame.b64 | base64 -d > work/assets/RoomWaitFrame.png
          test -s work/src/Plugin.cs
          test -s work/assets/RoomWaitFrame.png
          grep -q '0.3.47-alpha84' work/src/Plugin.cs
          grep -q 'class NativeDreamFx' work/src/NativeDreamFx.cs
          grep -q 'TeleportTrail' work/src/NativeDreamFx.cs
          grep -q 'TeleportTrail' work/src/ArenaGather.cs
          grep -q 'TeleportTrail' work/src/WorldRouting.cs
          grep -q 'TeleportTrail' work/src/CoopSession.cs

      - name: Download Hollow Knight Modding API v77 references
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o api.zip https://github.com/hk-modding/api/releases/download/1.5.78.11833-77/moddingapi.v77.windows.zip
          unzip -q api.zip -d api
          test -n "$(find api -type f -name Assembly-CSharp.dll -print -quit)"
          test -n "$(find api -type f -name MMHOOK_Assembly-CSharp.dll -print -quit)"
          test -n "$(find api -type f -name PlayMaker.dll -print -quit)"
          find api -type f -name '*.dll' -print | sort

      - name: Compile alpha84
        shell: bash
        run: |
          set -euo pipefail
          CSC="$(find /usr/share/dotnet/sdk -path '*/Roslyn/bincore/csc.dll' | sort -V | tail -1)"
          OUT="$PWD/out"
          mkdir -p "$OUT"
          RSP="$OUT/compile.rsp"
          {
            echo "-nologo"
            echo "-nostdlib+"
            echo "-target:library"
            echo "-langversion:latest"
            echo "-optimize+"
            echo "-deterministic+"
            echo "-debug:portable"
            echo "-out:$OUT/HollowKnightLocal8-alpha84.dll"
            echo "-resource:$PWD/work/assets/RoomWaitFrame.png,Local8.RoomWaitFrame"
            find api -type f -name '*.dll' ! -iname 'UnitySceneRepacker.dll' -print0 | sort -z | while IFS= read -r -d '' dll; do
              printf '%s\n' "-r:$dll"
            done
            find "$PWD/work/src" -maxdepth 1 -type f -name '*.cs' -print | sort
          } > "$RSP"
          dotnet "$CSC" "@$RSP"
          file "$OUT/HollowKnightLocal8-alpha84.dll"
          strings "$OUT/HollowKnightLocal8-alpha84.dll" | grep -q 'Hollow Knight Local 8'
          strings "$OUT/HollowKnightLocal8-alpha84.dll" | grep -q '0.3.47-alpha84'
          strings "$OUT/HollowKnightLocal8-alpha84.dll" | grep -q 'DREAM teleport trail'

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: HollowKnightLocal8-alpha84
          path: out/HollowKnightLocal8-alpha84.dll
          if-no-files-found: error
