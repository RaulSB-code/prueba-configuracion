name: Export 7zip Linux

on:
  push:
    branches:
      - chatgpt-hk-alpha84-main
    paths:
      - '.github/workflows/export-7zip.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and package 7zip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y 7zip
          echo "7zip package files:"
          dpkg -L 7zip
          mkdir -p pack
          cp -a /usr/lib/7zip pack/ || true
          cp -a /usr/bin/7z* pack/ || true
          cp -a /usr/bin/7zz* pack/ || true
          find pack -maxdepth 3 -type f -ls
          tar -cJf 7zip-linux.tar.xz -C pack .
      - uses: actions/upload-artifact@v4
        with:
          name: 7zip-linux
          path: 7zip-linux.tar.xz
